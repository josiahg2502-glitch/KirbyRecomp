# Controller Keybinds
# Edit values to customize. Restart the game to apply.
# Use SDL key names. Common: A B C ... Z, 0-9, F1-F12, Up Down Left Right,
# Return, Tab, Space, Left Shift, Right Shift, Left Ctrl, Right Ctrl,
# Backspace, Escape, Backslash. Use "None" to leave a button unbound.
#
# l2/r2/l3/r3 are only used by systems with a deeper button set than
# SNES (e.g. PSX L2/R2 shoulders, L3/R3 stick clicks); harmless if unused.
#
# Both players default to the same keys. Only a player whose Input
# source is Keyboard reads them, so this is not a conflict unless you
# put BOTH players on the keyboard -- rebind one if you do.

[player1]
a       = X
b       = Z
x       = S
y       = A
l       = C
r       = V
start   = Return
select  = Right Shift
up      = Up
down    = Down
left    = Left
right   = Right
l2      = Q
r2      = E
l3      = None
r3      = None

[player2]
a       = X
b       = Z
x       = S
y       = A
l       = C
r       = V
start   = Return
select  = Right Shift
up      = Up
down    = Down
left    = Left
right   = Right
l2      = Q
r2      = E
l3      = None
r3      = None

# Gamepad bindings (Xbox / PlayStation / Nintendo Switch / PC controllers)
# Native zero-latency remapping handled by mother3_bezel.dll.
# Edit here or run "Remap Controller.bat" in the game folder.
# Changes take effect IMMEDIATELY (hot-reloaded, no restart required)!
#
# Layout presets:
#   layout = xbox       (Xbox / PC style: A = Confirm, B = Cancel/Dash, X = Dash, Y = Confirm)
#   layout = nintendo   (Nintendo / Switch style: B = Confirm, A = Cancel/Dash, Y = Dash, X = Confirm)
#   layout = classic    (Direct 1:1 hardware: A = A, B = B, X = X, Y = Y)
#
# Analog Trigger Support:
#   trigger_l = true    (LT acts as GBA L-Shoulder; or set to "dash", "a", "b", "false")
#   trigger_r = true    (RT acts as GBA R-Shoulder; or set to "dash", "a", "b", "false")
#
# Optional custom button overrides (a, b, x, y, l, r, start, select, none):
[gamepad1]
layout     = xbox
a          = a
b          = b
x          = b
y          = a
lb         = l
rb         = r
select     = back
start      = start
trigger_l  = true
trigger_r  = true
deadzone   = 10000
analog     = true
